name: Bug report
description: Something isn't working.
labels: [bug, triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample that reproduces the problem.
      render: csharp
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: dotnet-runtime
    attributes:
      label: .NET runtime
      placeholder: ".NET 10.0 / net10.0"
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
